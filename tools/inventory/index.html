<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home inventory · rose at six</title>
  <meta name="description" content="What you own, where it lives, and when to replace it.">
  <meta name="theme-color" content="#F5EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1916" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">

  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="rose at six">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Applies your palette and light/dark mode before the first paint -->
  <script src="../../assets/js/theme-boot.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="inventory.css">
</head>
<body>
  <!-- Reusable flower shapes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="blossom" viewBox="-10 -10 20 20">
        <g fill="currentColor">
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(72)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(144)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(216)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(288)"/>
        </g>
        <circle r="2.3" style="fill: var(--blossom-center)"/>
      </symbol>
      <symbol id="rose" viewBox="0 0 48 48">
        <path d="M22 34c-6 1-11-1-14-5 5-2 10-1 14 5z" style="fill: var(--leaf)"/>
        <path d="M26 34c6 1 11-1 14-5-5-2-10-1-14 5z" style="fill: var(--leaf)" opacity=".8"/>
        <circle cx="24" cy="21" r="12.5" style="fill: var(--flower)"/>
        <path d="M24 18.5c2.4-.2 3.8 2 2.6 3.9-1.7 2.6-6.4 1.9-6.9-1.6-.6-4.4 5.2-7.4 9.3-4.6 4.6 3.2 3.4 10.6-2.2 12.2"
              fill="none" stroke-width="1.8" stroke-linecap="round" style="stroke: var(--flower-deep)"/>
      </symbol>
    </defs>
  </svg>

  <div class="page">
    <header class="topbar">
      <div class="crumbs">
        <a class="brand" href="../../" aria-label="rose at six, home">
          <svg class="brand-mark" aria-hidden="true"><use href="#rose"/></svg>
          <span class="brand-name">rose at six</span>
        </a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span class="crumb">Inventory</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="appearance-btn" type="button" aria-label="Appearance">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-.9.7-1.6 1.6-1.6h1.9a4.2 4.2 0 0 0 4.2-4.2c0-3.8-3.8-6.9-8.5-6.9z"/><circle cx="7.6" cy="11.5" r="1.1"/><circle cx="10.4" cy="7.6" r="1.1"/><circle cx="15" cy="7.9" r="1.1"/></svg>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <div class="account-slot" id="account-slot"></div>
      </div>
    </header>

    <div class="toolbar">
      <nav class="tabs" aria-label="Inventory views">
        <a href="#/items" data-tab="items" aria-label="Items" title="Items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg><span class="tab-label">Items</span></a>
        <a href="#/rooms" data-tab="rooms" aria-label="Rooms" title="Rooms"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><rect x="9.5" y="13" width="5" height="6.5" rx="1"/></svg><span class="tab-label">Rooms</span></a>
        <a href="#/due" data-tab="due" aria-label="Due" title="Due"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11V9.5a3 3 0 0 1 3-3h12"/><path d="m16 3.5 3 3-3 3"/><path d="M20 13v1.5a3 3 0 0 1-3 3H5"/><path d="m8 20.5-3-3 3-3"/></svg><span class="tab-label">Due</span></a>
        <a href="#/declutter" data-tab="declutter" aria-label="Declutter" title="Declutter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2"/><path d="M6.5 7l1 12a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-12"/><path d="M10.5 11v6M13.5 11v6"/></svg><span class="tab-label">Declutter</span></a>
        <a href="#/wishlist" data-tab="wishlist" aria-label="Wishlist" title="Wishlist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="tab-label">Wishlist</span></a>
      </nav>
      <button class="icon-btn add-btn" type="button" data-act="add" aria-label="Add an item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" type="button" data-act="settings" aria-label="Inventory settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/></svg>
      </button>
    </div>

    <main id="inventory" class="tool-main" aria-live="polite"></main>

    <footer class="footer">
      <svg class="footer-blossom" aria-hidden="true"><use href="#blossom"/></svg>
      <span>Encrypted on your device before it syncs</span>
    </footer>
  </div>

  <script type="module" src="inventory.js"></script>
</body>
</html>
