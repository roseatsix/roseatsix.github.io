<body>
  <!-- Reusable flower shapes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="blossom" viewBox="-10 -10 20 20">
        <g fill="currentColor">
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(72)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(144)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(216)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(288)"/>
        </g>
        <circle r="2.3" style="fill: var(--blossom-center)"/>
      </symbol>
      <symbol id="rose" viewBox="0 0 48 48">
        <path d="M22 34c-6 1-11-1-14-5 5-2 10-1 14 5z" style="fill: var(--leaf)"/>
        <path d="M26 34c6 1 11-1 14-5-5-2-10-1-14 5z" style="fill: var(--leaf)" opacity=".8"/>
        <circle cx="24" cy="21" r="12.5" style="fill: var(--flower)"/>
        <path d="M24 18.5c2.4-.2 3.8 2 2.6 3.9-1.7 2.6-6.4 1.9-6.9-1.6-.6-4.4 5.2-7.4 9.3-4.6 4.6 3.2 3.4 10.6-2.2 12.2"
              fill="none" stroke-width="1.8" stroke-linecap="round" style="stroke: var(--flower-deep)"/>
      </symbol>
    </defs>
  </svg>

  <div class="page">
    <header class="topbar">
      <div class="crumbs">
        <a class="brand" href="../../" aria-label="rose at six, home">
          <svg class="brand-mark" aria-hidden="true"><use href="#rose"/></svg>
          <span class="brand-name">rose at six</span>
        </a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span class="crumb">Documents</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="appearance-btn" type="button" aria-label="Appearance">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-.9.7-1.6 1.6-1.6h1.9a4.2 4.2 0 0 0 4.2-4.2c0-3.8-3.8-6.9-8.5-6.9z"/><circle cx="7.6" cy="11.5" r="1.1"/><circle cx="10.4" cy="7.6" r="1.1"/><circle cx="15" cy="7.9" r="1.1"/></svg>

          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <div class="account-slot" id="account-slot"></div>
      </div>
    </header>

    <div class="toolbar">
      <nav class="tabs" aria-label="Document tools">
        <a href="#/merge" data-tab="merge" aria-label="Merge" title="Merge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="7" height="9" rx="1.5"/><rect x="13.5" y="4" width="7" height="9" rx="1.5"/><path d="M7 13v2.5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V13"/><path d="M12 17.5V21"/></svg><span class="tab-label">Merge</span></a>
        <a href="#/pages" data-tab="pages" aria-label="Pages" title="Pages"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="11" height="14" rx="2"/><path d="M9 20.5h8a2 2 0 0 0 2-2V8"/></svg><span class="tab-label">Pages</span></a>
        <a href="#/compress" data-tab="compress" aria-label="Compress" title="Compress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v6"/><path d="m9 6 3 3 3-3"/><path d="M12 21v-6"/><path d="m9 18 3-3 3 3"/><path d="M4 12h16"/></svg><span class="tab-label">Compress</span></a>

        <a href="#/protect" data-tab="protect" aria-label="Protect" title="Protect a copy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 5 6v5.5c0 4.3 3 7.6 7 9 4-1.4 7-4.7 7-9V6z"/><path d="M8.5 12h7"/></svg><span class="tab-label">Protect</span></a>
      </nav>
    </div>

    <main id="docs" class="tool-main"></main>

    <footer class="footer">
      <svg class="footer-blossom" aria-hidden="true"><use href="#blossom"/></svg>
      <span>Files are processed on your device and never uploaded</span>
    </footer>
  </div>

  <script type="module" src="app.js"></script>

</html>
