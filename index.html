<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rose at six</title>
  <meta name="description" content="A small garden of everyday tools.">
  <meta name="theme-color" content="#F5EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F1A17" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    try {
      var t = localStorage.getItem('ras-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&family=Nunito+Sans:opsz,wght@6..12,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Reusable flower shapes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="blossom" viewBox="-10 -10 20 20">
        <g fill="currentColor">
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(72)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(144)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(216)"/>
          <ellipse cx="0" cy="-4.6" rx="3.1" ry="4.4" transform="rotate(288)"/>
        </g>
        <circle r="2.3" style="fill: var(--blossom-center)"/>
      </symbol>
      <symbol id="rose" viewBox="0 0 48 48">
        <path d="M22 34c-6 1-11-1-14-5 5-2 10-1 14 5z" style="fill: var(--sage)"/>
        <path d="M26 34c6 1 11-1 14-5-5-2-10-1-14 5z" style="fill: var(--sage)" opacity=".8"/>
        <circle cx="24" cy="21" r="12.5" style="fill: var(--rose)"/>
        <path d="M24 18.5c2.4-.2 3.8 2 2.6 3.9-1.7 2.6-6.4 1.9-6.9-1.6-.6-4.4 5.2-7.4 9.3-4.6 4.6 3.2 3.4 10.6-2.2 12.2"
              fill="none" stroke-width="1.8" stroke-linecap="round" style="stroke: var(--rose-deep)"/>
      </symbol>
    </defs>
  </svg>

  <div class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="rose at six, home">
        <svg class="brand-mark" aria-hidden="true"><use href="#rose"/></svg>
        <span class="brand-name">rose at six</span>
      </a>
      <div class="topbar-actions">
        <span class="chip chip-muted" title="Sign-in and encrypted sync are coming next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          Sign-in soon
        </span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-text">
          <p class="eyebrow" id="today">Today</p>
          <h1 id="greeting">Good day</h1>
          <p class="lede">A small garden of everyday tools, all in one place.</p>
        </div>

        <!-- Decorative sprig -->
        <svg class="sprig" viewBox="0 0 220 180" aria-hidden="true">
          <path class="stem" d="M30 170C70 140 96 112 118 72s52-52 84-56"/>
          <path class="stem" d="M96 116c16-4 34 0 46 12"/>
          <path class="stem" d="M128 60c-6-14-4-28 6-40"/>
          <path class="leaf" d="M70 140c-4-16 4-28 20-32 2 16-6 28-20 32z"/>
          <path class="leaf" d="M152 50c10-10 24-12 36-4-10 10-24 12-36 4z"/>
          <path class="leaf" d="M108 92c-12-6-18-18-14-30 12 4 18 16 14 30z"/>
          <use href="#blossom" class="b b1" x="186" y="2" width="30" height="30"/>
          <use href="#blossom" class="b b2" x="122" y="4" width="22" height="22"/>
          <use href="#blossom" class="b b3" x="136" y="118" width="24" height="24"/>
          <use href="#blossom" class="b b4" x="58" y="98" width="14" height="14"/>
        </svg>
      </section>

      <div id="tool-groups"></div>
    </main>

    <footer class="footer">
      <svg class="footer-blossom" aria-hidden="true"><use href="#blossom"/></svg>
      <span>rose at six · tools grow here over time</span>
    </footer>
  </div>

  <script src="assets/js/hub.js"></script>
</body>
</html>
